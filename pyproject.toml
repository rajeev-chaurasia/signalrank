[project]
name = "signalrank"
version = "0.1.0"
description = "A dual encoder and cross-encoder reranker whose retrieval gains are re-measured under the quantized index that actually serves them."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rajeev Chaurasia", email = "rajeevchaurasia.dev@gmail.com" }]
dependencies = [
    "bm25s>=0.2",
    "faiss-cpu>=1.9",
    "numpy>=2.0",
    "pydantic>=2.8",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.44",
    "typer>=0.12",
]

[project.scripts]
signalrank = "signalrank.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalrank"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evaluation", "script"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# evaluation/, script/ and tests/ are imported as packages from the repository
# root but are neither installed nor under src, so isort would otherwise file
# them as third party.
known-first-party = ["signalrank", "evaluation", "script", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "script", "evaluation"]

[[tool.mypy.overrides]]
# faiss is a SWIG extension and bm25s ships no stubs. The transformers and
# sentence-transformers stubs are partial rather than absent, and the
# re-exports they omit are not worth working around.
module = ["faiss", "bm25s", "bm25s.*", "transformers", "transformers.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/signalrank"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
